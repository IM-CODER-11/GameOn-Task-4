<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heist Climb - Rooftop Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <!-- Menu Screen -->
        <div id="menuScreen">
            <h1>Heist Climb</h1>
            <p id="loadingText">Loading assets...</p> <!-- If one of the assets don't load -->
            <button id="singlePlayerBtn">Single Player</button>
            <button id="twoPlayerBtn">Two Player (Versus)</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div id="hudWrapper">
                <!-- Player 1 HUD -->
                <div id="hudP1" class="hudBar" style="width: 100%;">
                    <span><span id="hudTitleP1">Score</span>:<span id="scoreP1">0</span></span>
                    <span id="livesP1">❤️❤️❤️</span>
                </div>
            </div>
        </div>
    
    </div>

    <script scr="game.js"></script>
</body>
</html>

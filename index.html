<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heist Climb - Rooftop Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <!-- Menu Screen -->
        <div id="menuScreen">
            <h1>Heist Climb</h1>
            <p id="loadingText">Loading assets...</p> <!-- If one of the assets don't load -->
            <button id="singlePlayerBtn">Single Player</button>
            <button id="twoPlayerBtn">Two Player (Versus)</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div id="hudWrapper">
                <!-- Player 1 HUD -->
                <div id="hudP1" class="hudBar" style="width: 100%;">
                    <span><span id="hudTitleP1">Score</span>:<span id="scoreP1">0</span></span>
                    <span id="livesP1">❤️❤️❤️</span>
                    <span>Level <span id="levelP1">1</span></span>
                </div>
                <!-- Player 2 HUD -->
                <div id="hudP2" class="hudBar hidden" style="width: 100%; margin-left: 10px;">
                    <span><b>Player 2</b> | Score: <span id="scoreP2">0</span></span>
                    <span id="livesP2">❤️❤️❤️</span>
                    <span>Level <span id="levelP2">2</span></span>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>
            <div id="controlsText">Controls: A/D or Arrow Keys to climb.</div>
        </div>

        <!-- End Screen -->
        <div id="endScreen" class="hidden">
            <h2 id="endTitle">Game Over</h2>
            <img id="endImage" class="hidden" alt="Helicopter">
            <p id="endMessage"></p>
            <button id="restartBtn">Main Menu</button>
        </div>
    </div>

    <script scr="game.js"></script>
</body>
</html>
